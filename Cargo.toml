[package]
name = "bucketlist"
version = "1.0.0"
edition = "2024"
description = "A devastatingly simple bucket list CLI and .bucketlist file format."
license = "MIT"
repository = "https://github.com/karchyland/bucketlist"
readme = "README.md"

[[bin]]
name = "bucket"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
home = "0.5.12"
